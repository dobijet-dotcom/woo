<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설명문 수업 활동</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#eeece9;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.22);
  --r:8px;--rl:12px;
  --blue:#185fa5;--blue-bg:#e6f1fb;
  --green:#3b6d11;--green-bg:#eaf3de;
  --amber:#854f0b;--amber-bg:#faeeda;
  --red:#a32d2d;--red-bg:#fcebeb;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
    --text:#f0ede8;--text2:#aaa;--text3:#666;
    --border:rgba(255,255,255,.12);--border2:rgba(255,255,255,.22);
    --blue:#85b7eb;--blue-bg:#0c2a45;
    --green:#c0dd97;--green-bg:#173404;
    --amber:#fac775;--amber-bg:#412402;
    --red:#f09595;--red-bg:#501313;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}

/* ── 전체 레이아웃 ── */
.app{max-width:760px;margin:0 auto;padding:1.25rem 1rem 4rem}

/* ── 헤더 ── */
.app-header{background:var(--bg);border-bottom:0.5px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:1.25rem;border-radius:var(--rl);border:0.5px solid var(--border)}
.app-title{font-size:17px;font-weight:500;color:var(--text)}
.app-subtitle{font-size:12px;color:var(--text2);margin-top:2px}

/* ── 설정 패널 ── */
.setup-panel{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:1.25rem}
.setup-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.setup-label{font-size:13px;color:var(--text2);min-width:60px}
.team-input{padding:6px 10px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);font-size:13px;color:var(--text);width:160px}
.team-input:focus{outline:none;border-color:var(--blue)}
.timer-select{padding:6px 10px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);font-size:13px;color:var(--text);cursor:pointer}
.setup-divider{width:1px;height:24px;background:var(--border);margin:0 4px}

/* ── 타이머 ── */
.timer-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:var(--r);background:var(--bg2);border:0.5px solid var(--border);margin-bottom:1rem;flex-wrap:wrap}
.timer-display{font-size:28px;font-weight:500;color:var(--text);min-width:64px;font-variant-numeric:tabular-nums}
.timer-display.urgent{color:#a32d2d}
.timer-btn{padding:5px 12px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);font-size:12px;cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;gap:4px}
.timer-btn:hover{background:var(--bg3)}
.timer-prog-wrap{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;min-width:80px}
.timer-prog{height:5px;border-radius:3px;background:var(--blue);transition:width .5s linear}
.timer-prog.urgent{background:#a32d2d}

/* ── 단계 탭 ── */
.step-tabs{display:flex;gap:0;margin-bottom:1.25rem;border-radius:var(--rl);overflow:hidden;border:0.5px solid var(--border)}
.step-tab{flex:1;padding:10px 8px;text-align:center;font-size:13px;cursor:pointer;background:var(--bg2);color:var(--text2);border:none;border-right:0.5px solid var(--border);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.step-tab:last-child{border-right:none}
.step-tab.active{background:var(--text);color:var(--bg);font-weight:500}
.step-tab.locked{color:var(--text3);cursor:not-allowed}
.step-tab .step-check{width:16px;height:16px;border-radius:50%;background:var(--green-bg);color:var(--green);font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── 설명문 탭 ── */
.essay-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.etab{padding:5px 12px;border-radius:14px;border:0.5px solid var(--border2);background:var(--bg);font-size:12px;cursor:pointer;color:var(--text2)}
.etab.active{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ── 액션 행 ── */
.act-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.btn{padding:7px 14px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);font-size:13px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:background .12s}
.btn:hover{background:var(--bg2)}
.btn:active{transform:scale(.98)}
.btn.locked{color:var(--text3);border-color:var(--border);cursor:not-allowed}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.88}
.score-pill{font-size:12px;color:var(--text2);padding:5px 10px;border-radius:12px;background:var(--bg2);border:0.5px solid var(--border)}

/* ── 배치 활동 ── */
.pool-label{font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.pool{min-height:60px;border-radius:var(--rl);border:1.5px dashed var(--border2);padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.25rem;transition:background .12s}
.pool.drag-over{background:var(--blue-bg);border-color:var(--blue)}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1rem}
@media(max-width:480px){.zones{grid-template-columns:1fr}}
.zone{border-radius:var(--rl);border:1.5px dashed var(--border2);min-height:110px;padding:10px;display:flex;flex-direction:column;gap:6px;transition:background .12s}
.zone.drag-over{background:var(--bg2);border-color:var(--border2)}
.zone-label{font-size:12px;font-weight:500;text-align:center;padding:3px 0 7px;border-bottom:0.5px solid var(--border);margin-bottom:2px;display:flex;align-items:center;justify-content:center;gap:5px}
.zone-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.card{padding:9px 11px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);font-size:13px;line-height:1.65;color:var(--text);cursor:grab;user-select:none;transition:border-color .12s;touch-action:none}
.card:hover{border-color:var(--border2)}
.card.dragging{opacity:.35;cursor:grabbing}
.card.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);cursor:default}
.card.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.notice-empty{font-size:12px;color:var(--text3);padding:8px;text-align:center}

/* 오답 해설 */
.explain-tag{font-size:11px;color:var(--text3);margin-top:4px;font-style:italic}

/* ── 표지어 퀴즈 ── */
.passage{display:flex;flex-direction:column;gap:12px}
.para-card{padding:13px 15px;border-radius:var(--r);border:0.5px solid var(--border);background:var(--bg)}
.para-num{font-size:11px;color:var(--text3);margin-bottom:6px}
.para-text{font-size:14px;line-height:1.85;color:var(--text)}
.word-span{cursor:pointer;border-radius:3px;padding:1px 2px;border-bottom:1.5px solid transparent;transition:background .1s}
.word-span:hover{background:var(--blue-bg);border-bottom-color:var(--blue)}
.word-span.state-correct{background:var(--green-bg);color:var(--green);font-weight:500;border-bottom:2px solid var(--green);cursor:default}
.word-span.state-revealed{background:var(--amber-bg);color:var(--amber);font-weight:500;border-bottom:2px solid var(--amber);cursor:default}
.m-badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:11px;font-weight:500;margin-left:3px;vertical-align:middle}

/* ── 팝업 ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:999}
.popup{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--rl);padding:20px 22px;width:min(360px,92vw)}
.popup-word{font-size:17px;font-weight:500;margin-bottom:3px}
.popup-sub{font-size:12px;color:var(--text3);margin-bottom:14px}
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.m-btn{padding:9px 8px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);font-size:13px;cursor:pointer;color:var(--text2);text-align:left;display:flex;flex-direction:column;gap:2px}
.m-btn:hover{background:var(--bg2)}
.m-btn .mn{display:flex;align-items:center;gap:5px;font-size:13px}
.m-btn .md{font-size:10px;color:var(--text3);font-style:italic;padding-left:13px}
.m-btn.ok{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.m-btn.ng{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.popup-fb{margin-top:10px;padding:9px 12px;border-radius:var(--r);font-size:13px;text-align:center;display:none}
.fb-ok{background:var(--green-bg);color:var(--green)}
.fb-ng{background:var(--red-bg);color:var(--red)}
.popup-close{margin-top:12px;width:100%;padding:8px;border-radius:var(--r);border:0.5px solid var(--border);background:var(--bg);font-size:13px;cursor:pointer;color:var(--text2)}
.popup-close:hover{background:var(--bg2)}

/* ── 결과 ── */
.result-box{border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-top:1rem}
.result-head{padding:10px 16px;background:var(--bg2);border-bottom:0.5px solid var(--border);font-size:13px;font-weight:500}
.result-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.result-zone{font-size:12px;font-weight:500;margin-bottom:4px}
.result-para{padding:7px 10px;border-radius:var(--r);font-size:13px;line-height:1.6;border-left:3px solid transparent;margin-bottom:4px}
.result-explain{font-size:11px;font-style:italic;margin-top:3px;opacity:.8}

/* 정답 목록 */
.ans-list{display:flex;flex-direction:column;gap:6px;margin-top:1rem}
.ans-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--r);background:var(--bg2);font-size:13px}
.ans-word{font-weight:500;min-width:110px}
.ans-check{margin-left:auto;font-size:12px;color:var(--green)}

/* 완료 배너 */
.complete-banner{padding:11px 16px;border-radius:var(--r);background:var(--green-bg);border:0.5px solid var(--green);font-size:14px;color:var(--green);font-weight:500;margin-bottom:1rem;display:none;align-items:center;gap:8px}
.complete-banner.show{display:flex}

/* 점수판 */
.scoreboard{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-top:1.25rem}
.scoreboard h3{font-size:14px;font-weight:500;margin-bottom:12px;color:var(--text)}
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.score-card{padding:12px 14px;border-radius:var(--r);background:var(--bg2);border:0.5px solid var(--border);text-align:center}
.score-card .sc-team{font-size:12px;color:var(--text2);margin-bottom:6px}
.score-card .sc-score{font-size:26px;font-weight:500;color:var(--text)}
.score-card .sc-label{font-size:11px;color:var(--text3)}

/* lock tip */
.lock-tip{font-size:12px;color:var(--text3);padding:5px 10px;border-radius:var(--r);background:var(--bg2);display:none;align-items:center;gap:4px}
.lock-tip.show{display:inline-flex}
</style>
</head>
<body>
<div class="app">

<!-- 헤더 -->
<div class="app-header">
  <div>
    <div class="app-title">설명문 수업 활동</div>
    <div class="app-subtitle">1단계: 문단 배치 → 2단계: 표지어 퀴즈</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <input class="team-input" id="team-input" placeholder="모둠명 입력" maxlength="12">
    <select class="timer-select" id="timer-select">
      <option value="0">타이머 없음</option>
      <option value="120">2분</option>
      <option value="180" selected>3분</option>
      <option value="300">5분</option>
      <option value="600">10분</option>
    </select>
  </div>
</div>

<!-- 타이머 -->
<div class="timer-bar" id="timer-bar" style="display:none">
  <span class="timer-display" id="timer-display">3:00</span>
  <div class="timer-prog-wrap"><div class="timer-prog" id="timer-prog" style="width:100%"></div></div>
  <button class="timer-btn" onclick="startTimer()"><i class="ti ti-player-play" aria-hidden="true"></i> 시작</button>
  <button class="timer-btn" onclick="pauseTimer()"><i class="ti ti-player-pause" aria-hidden="true"></i> 일시정지</button>
  <button class="timer-btn" onclick="resetTimer()"><i class="ti ti-refresh" aria-hidden="true"></i> 초기화</button>
</div>

<!-- 설명문 탭 -->
<div class="essay-tabs" id="essay-tabs"></div>

<!-- 단계 탭 -->
<div class="step-tabs">
  <button class="step-tab active" id="stab-0" onclick="goStep(0)">
    <i class="ti ti-layout-cards" aria-hidden="true"></i> 1단계 — 문단 배치
  </button>
  <button class="step-tab locked" id="stab-1" onclick="goStep(1)">
    <i class="ti ti-lock" id="stab1-icon" aria-hidden="true"></i> 2단계 — 표지어 퀴즈
  </button>
</div>

<!-- ───────────── 1단계: 배치 활동 ───────────── -->
<div id="step-0">
  <div class="act-row">
    <button class="btn locked" id="check-btn" onclick="checkArrange()">
      <i class="ti ti-check" id="check-icon" aria-hidden="true"></i> 확인하기
    </button>
    <button class="btn" onclick="resetArrange()"><i class="ti ti-refresh" aria-hidden="true"></i> 다시하기</button>
    <span class="score-pill" id="arr-score">0 / 0 배치됨</span>
    <span class="lock-tip" id="arr-lock-tip"><i class="ti ti-info-circle" aria-hidden="true"></i> 모두 배치해야 확인할 수 있어요</span>
  </div>

  <div class="pool-label">문단 카드 — 여기서 끌어다 놓으세요</div>
  <div class="pool" id="pool"
    ondragover="onDragOver(event,this)"
    ondrop="onDrop(event,'pool')"
    ondragleave="onDragLeave(this)"></div>

  <div class="zones">
    <div class="zone" id="zone-처음"
      ondragover="onDragOver(event,this)"
      ondrop="onDrop(event,'처음')"
      ondragleave="onDragLeave(this)">
      <div class="zone-label" style="color:var(--blue)">
        <div class="zone-dot" style="background:var(--blue)"></div>처음
      </div>
    </div>
    <div class="zone" id="zone-중간"
      ondragover="onDragOver(event,this)"
      ondrop="onDrop(event,'중간')"
      ondragleave="onDragLeave(this)">
      <div class="zone-label" style="color:var(--green)">
        <div class="zone-dot" style="background:var(--green)"></div>중간
      </div>
    </div>
    <div class="zone" id="zone-끝"
      ondragover="onDragOver(event,this)"
      ondrop="onDrop(event,'끝')"
      ondragleave="onDragLeave(this)">
      <div class="zone-label" style="color:var(--amber)">
        <div class="zone-dot" style="background:var(--amber)"></div>끝
      </div>
    </div>
  </div>

  <div id="arr-result"></div>
</div>

<!-- ───────────── 2단계: 표지어 퀴즈 ───────────── -->
<div id="step-1" style="display:none">
  <div class="complete-banner" id="complete-banner">
    <i class="ti ti-circle-check" aria-hidden="true"></i>
    모든 표지어를 맞혔어요! 정답 목록을 확인할 수 있어요.
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding:10px 14px;border-radius:var(--r);background:var(--bg2);border:0.5px solid var(--border);flex-wrap:wrap">
    <div style="text-align:center;min-width:44px">
      <div style="font-size:22px;font-weight:500" id="sc-found">0</div>
      <div style="font-size:11px;color:var(--text2)">맞힘</div>
    </div>
    <div style="width:1px;height:32px;background:var(--border)"></div>
    <div style="text-align:center;min-width:44px">
      <div style="font-size:22px;font-weight:500" id="sc-total">0</div>
      <div style="font-size:11px;color:var(--text2)">전체</div>
    </div>
    <div style="width:1px;height:32px;background:var(--border)"></div>
    <div style="font-size:13px;color:var(--text2);flex:1" id="sc-msg">표지어를 클릭해 설명 방법을 맞혀 보세요!</div>
  </div>

  <div class="act-row">
    <button class="btn locked" id="reveal-btn" onclick="revealMarkers()">
      <i class="ti ti-lock" id="reveal-icon" aria-hidden="true"></i>
      <span id="reveal-label">정답 공개</span>
    </button>
    <button class="btn" onclick="resetMarkers()"><i class="ti ti-refresh" aria-hidden="true"></i> 다시하기</button>
    <span class="lock-tip" id="quiz-lock-tip"><i class="ti ti-info-circle" aria-hidden="true"></i> 모두 맞혀야 열려요</span>
  </div>

  <div class="passage" id="passage"></div>
  <div id="marker-result"></div>
</div>

<!-- 점수판 -->
<div class="scoreboard" id="scoreboard" style="display:none">
  <h3><i class="ti ti-trophy" aria-hidden="true" style="margin-right:6px"></i>모둠 점수판</h3>
  <div class="score-grid" id="score-grid"></div>
  <div style="margin-top:12px">
    <button class="btn" onclick="clearScores()"><i class="ti ti-trash" aria-hidden="true"></i> 점수 초기화</button>
  </div>
</div>

</div><!-- /app -->

<!-- 팝업 -->
<div class="overlay" id="popup" style="display:none" onclick="onOverlayClick(event)">
  <div class="popup">
    <div class="popup-word" id="pw-word"></div>
    <div class="popup-sub">이 표지어는 어떤 설명 방법인가요?</div>
    <div class="method-grid" id="pw-grid"></div>
    <div class="popup-fb" id="pw-fb"></div>
    <button class="popup-close" onclick="closePopup()">닫기</button>
  </div>
</div>

<!-- 타이머 종료 알림 -->
<div class="overlay" id="timer-end-popup" style="display:none">
  <div class="popup" style="text-align:center">
    <div style="font-size:40px;margin-bottom:10px">⏰</div>
    <div style="font-size:18px;font-weight:500;margin-bottom:6px">시간 종료!</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">활동을 마무리하세요.</div>
    <button class="btn primary" onclick="closeTimerEnd()" style="width:100%;justify-content:center">확인</button>
  </div>
</div>

<script>
// ════════════════════════════════════════
// 데이터
// ════════════════════════════════════════
const METHOD_INFO={
  "정의":{core:"~이란, ~을 말한다",desc:"대상의 뜻이나 본질을 밝힘"},
  "예시":{core:"예를 들면, 예컨대",desc:"구체적 사례를 들어 설명함"},
  "비교":{core:"마찬가지로, 공통점",desc:"둘 이상 대상의 공통점을 밝힘"},
  "대조":{core:"이와 다르게, 반면",desc:"둘 이상 대상의 차이점을 밝힘"},
  "분류":{core:"~로 분류된다, ~에 속한다",desc:"여러 대상을 공통 속성으로 묶어 그룹을 만듦"},
  "구분":{core:"~로 구분된다, 기준으로",desc:"하나의 대상을 기준에 따라 나눔"},
  "인과":{core:"때문에, 그 결과",desc:"원인과 결과의 관계를 밝힘"},
  "분석":{core:"로 구성된다, 로 이루어진다",desc:"구성 요소나 부분으로 나눠 설명함"},
};
const METHODS=Object.keys(METHOD_INFO);

let curE=0, curStep=0;

let timerTotal=0, timerLeft=0, timerInterval=null, timerRunning=false;

document.getElementById("timer-select").addEventListener("change", function(){
  const v=parseInt(this.value);
  if(v===0){document.getElementById("timer-bar").style.display="none";}
  else{
    timerTotal=v; timerLeft=v; timerRunning=false;
    clearInterval(timerInterval);
    document.getElementById("timer-bar").style.display="flex";
    renderTimerDisplay();
  }
});

function renderTimerDisplay(){
  const m=Math.floor(timerLeft/60), s=timerLeft%60;
  const disp=document.getElementById("timer-display");
  disp.textContent=`${m}:${s.toString().padStart(2,"0")}`;
  disp.classList.toggle("urgent", timerLeft<=30 && timerLeft>0);
  const pct=timerTotal>0?timerLeft/timerTotal*100:100;
  const prog=document.getElementById("timer-prog");
  prog.style.width=pct+"%";
  prog.classList.toggle("urgent", timerLeft<=30);
}
function startTimer(){
  if(timerRunning||timerLeft<=0) return;
  timerRunning=true;
  timerInterval=setInterval(()=>{
    timerLeft--;
    renderTimerDisplay();
    if(timerLeft<=0){
      clearInterval(timerInterval); timerRunning=false;
      document.getElementById("timer-end-popup").style.display="flex";
    }
  },1000);
}
function pauseTimer(){clearInterval(timerInterval);timerRunning=false;}
function resetTimer(){
  clearInterval(timerInterval); timerRunning=false;
  timerLeft=timerTotal; renderTimerDisplay();
}
function closeTimerEnd(){document.getElementById("timer-end-popup").style.display="none";}

function renderEssayTabs(){
  document.getElementById("essay-tabs").innerHTML=
    ESSAYS.map((e,i)=>`<button class="etab${i===curE?" active":""}" onclick="selectEssay(${i})">${i+1}. ${e.title}</button>`).join("");
}
function selectEssay(i){
  curE=i; curStep=0;
  arrPlacement={}; arrChecked=false; poolOrder=null;
  markerState={}; markerRevealed=false;
  document.getElementById("arr-result").innerHTML="";
  document.getElementById("marker-result").innerHTML="";
  document.getElementById("complete-banner").classList.remove("show");
  renderEssayTabs(); renderStepTabs(); showStep(0); renderArrange(); updateArrScore();
}
function renderStepTabs(){
  const s0=document.getElementById("stab-0");
  const s1=document.getElementById("stab-1");
  const icon=document.getElementById("stab1-icon");
  s0.classList.toggle("active", curStep===0);
  s1.classList.toggle("active", curStep===1);
  const unlocked=arrChecked;
  s1.classList.toggle("locked", !unlocked);
  icon.className=unlocked?"ti ti-text-size":"ti ti-lock";
  if(unlocked&&curStep===1){
    s1.innerHTML=`<span class="step-check">✓</span> 2단계 — 표지어 퀴즈`;
  }
}
function goStep(n){
  if(n===1&&!arrChecked) return;
  curStep=n; renderStepTabs(); showStep(n);
  if(n===1){renderQuiz(); updateQuizScore();}
}
function showStep(n){
  document.getElementById("step-0").style.display=n===0?"block":"none";
  document.getElementById("step-1").style.display=n===1?"block":"none";
}

function initArr(){
  arrPlacement={}; arrChecked=false; poolOrder=null;
  ESSAYS[curE].paras.forEach(p=>arrPlacement[p.id]="pool");
}
function shuffled(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function cardHTML(para){
  const zone=arrPlacement[para.id];
  const inZone=zone!=="pool";
  let cls="card";
  if(arrChecked&&inZone){cls+=zone===para.struct?" correct":" wrong";}
  const draggable=!arrChecked;
  const explain=arrChecked&&inZone&&zone!==para.struct
    ?`<div class="explain-tag">이 문단은 '${para.struct}' 단계예요. ${EXPLAINS[para.struct]}</div>`:"";
  return `<div class="${cls}" id="card-${para.id}"
    ${draggable?`draggable="true"
      ondragstart="onDragStart(event,'${para.id}')"
      ondragend="onDragEnd(event)"
      ontouchstart="onTS(event,'${para.id}')"
      ontouchmove="onTM(event)"
      ontouchend="onTE(event)"`:""}
  >${para.text}${explain}</div>`;
}

function renderArrange(){
  renderPool(); renderZones(); updateCheckBtn();
}
function renderPool(){
  const pool=document.getElementById("pool");
  const items=ESSAYS[curE].paras.filter(p=>arrPlacement[p.id]==="pool");
  if(!poolOrder) poolOrder=shuffled(items.map(p=>p.id));
  const ordered=poolOrder.map(id=>items.find(p=>p.id===id)).filter(Boolean);
  pool.innerHTML=ordered.length
    ?ordered.map(cardHTML).join("")
    :`<div class="notice-empty">모든 카드를 배치했어요</div>`;
}
function renderZones(){
  ["처음","중간","끝"].forEach(z=>{
    const el=document.getElementById(`zone-${z}`);
    const label=el.querySelector(".zone-label").outerHTML;
    const items=ESSAYS[curE].paras.filter(p=>arrPlacement[p.id]===z);
    el.innerHTML=label+(items.length
      ?items.map(cardHTML).join("")
      :`<div class="notice-empty">카드를 여기에 놓으세요</div>`);
    el.ondragover=e=>onDragOver(e,el);
    el.ondrop=e=>onDrop(e,z);
    el.ondragleave=()=>onDragLeave(el);
  });
}
function updateArrScore(){
  const total=ESSAYS[curE].paras.length;
  const placed=Object.values(arrPlacement).filter(v=>v!=="pool").length;
  document.getElementById("arr-score").textContent=`${placed} / ${total} 배치됨`;
}
function updateCheckBtn(){
  const total=ESSAYS[curE].paras.length;
  const placed=Object.values(arrPlacement).filter(v=>v!=="pool").length;
  const allPlaced=placed===total;
  const btn=document.getElementById("check-btn");
  const icon=document.getElementById("check-icon");
  btn.classList.toggle("locked",!allPlaced);
  icon.className=allPlaced?"ti ti-check":"ti ti-lock";
}
function checkArrange(){
  const total=ESSAYS[curE].paras.length;
  const placed=Object.values(arrPlacement).filter(v=>v!=="pool").length;
  if(placed<total){
    const tip=document.getElementById("arr-lock-tip");
    tip.classList.add("show"); setTimeout(()=>tip.classList.remove("show"),2000);
    return;
  }
  arrChecked=true;
  let correct=0;
  ESSAYS[curE].paras.forEach(p=>{if(arrPlacement[p.id]===p.struct)correct++;});
  renderZones();
  showArrResult(correct,total);
  renderStepTabs();
  saveScore("step0",correct,total);
}
function showArrResult(correct,total){
  const pct=Math.round(correct/total*100);
  const msgs=["다시 도전해 보세요!","조금 더 생각해 보세요!","잘하고 있어요!","거의 다 맞혔어요!","완벽해요!"];
  const sections=["처음","중간","끝"].map(z=>{
    const items=ESSAYS[curE].paras.filter(p=>arrPlacement[p.id]===z);
    const paras=items.map(p=>{
      const ok=p.struct===z;
      return `<div class="result-para" style="background:${ok?"var(--green-bg)":"var(--red-bg)"};border-left-color:${ok?"var(--green)":"var(--red)"};color:${ok?"var(--green)":"var(--red)"}">${ok?"✓":"✗"} ${p.text}
        ${!ok?`<div class="result-explain">'${p.struct}' 단계 — ${EXPLAINS[p.struct]}</div>`:""}
      </div>`;
    }).join("");
    return `<div><div class="result-zone" style="color:${ZONE_C[z]}">${z}</div>${paras||`<div style="font-size:12px;color:var(--text3)">비어 있음</div>`}</div>`;
  }).join("");
  document.getElementById("arr-result").innerHTML=`
    <div class="result-box">
      <div class="result-head">${correct}/${total}개 정답 (${pct}점) — ${msgs[Math.min(Math.floor(pct/21),4)]}</div>
      <div class="result-body">${sections}</div>
    </div>
    <div style="margin-top:12px">
      <button class="btn primary" onclick="goStep(1)"><i class="ti ti-arrow-right" aria-hidden="true"></i> 2단계로 이동</button>
    </div>`;
}
function resetArrange(){
  poolOrder=null; arrChecked=false;
  ESSAYS[curE].paras.forEach(p=>arrPlacement[p.id]="pool");
  document.getElementById("arr-result").innerHTML="";
  renderArrange(); updateArrScore(); renderStepTabs();
}

// drag
function onDragStart(e,id){
  draggingId=id; e.dataTransfer.effectAllowed="move";
  setTimeout(()=>{const el=document.getElementById(`card-${id}`);if(el)el.classList.add("dragging");},0);
}
function onDragEnd(){
  if(draggingId){const el=document.getElementById(`card-${draggingId}`);if(el)el.classList.remove("dragging");}
  draggingId=null;
  document.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over"));
}
function onDragOver(e,el){e.preventDefault();el.classList.add("drag-over");}
function onDragLeave(el){el.classList.remove("drag-over");}
function onDrop(e,target){
  e.preventDefault();
  if(!draggingId) return;
  document.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over"));
  arrPlacement[draggingId]=target; draggingId=null;
  renderArrange(); updateArrScore();
}

// touch
let _tid=null,_tclone=null;
function onTS(e,id){
  _tid=id;
  const orig=document.getElementById(`card-${id}`);
  _tclone=orig.cloneNode(true);
  const r=orig.getBoundingClientRect();
  _tclone.style.cssText=`position:fixed;z-index:9999;pointer-events:none;opacity:.8;width:${orig.offsetWidth}px;left:${r.left}px;top:${r.top}px;`;
  document.body.appendChild(_tclone);
  orig.classList.add("dragging");
}
function onTM(e){
  if(!_tclone) return; e.preventDefault();
  const t=e.touches[0];
  _tclone.style.left=(t.clientX-_tclone.offsetWidth/2)+"px";
  _tclone.style.top=(t.clientY-24)+"px";
}
function onTE(e){
  if(!_tid||!_tclone) return;
  const t=e.changedTouches[0];
  _tclone.style.display="none";
  const below=document.elementFromPoint(t.clientX,t.clientY);
  _tclone.style.display="";
  let target="pool";
  if(below){
    const z=below.closest(".zone"); const pl=below.closest(".pool");
    if(z) target=z.id.replace("zone-","");
    else if(pl) target="pool";
  }
  arrPlacement[_tid]=target;
  document.body.removeChild(_tclone); _tclone=null;
  const orig=document.getElementById(`card-${_tid}`);
  if(orig) orig.classList.remove("dragging");
  _tid=null;
  renderArrange(); updateArrScore();
}

// ════════════════════════════════════════
// 2단계: 표지어 퀴즈
// ════════════════════════════════════════
function mkey(pi,word){return `${curE}-${pi}-${word}`;}
function totalM(){return ESSAYS[curE].paras.reduce((s,p)=>s+p.markers.length,0);}
function foundM(){return ESSAYS[curE].paras.reduce((s,p,pi)=>s+p.markers.filter(m=>markerState[mkey(pi,m.word)]==="correct").length,0);}
function allCorrectM(){return foundM()===totalM();}

function escH(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function escA(s){return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'");}

function tokenize(text,markers,pi){
  if(!markers.length) return escH(text);
  const sorted=[...markers].sort((a,b)=>b.word.length-a.word.length);
  let segs=[{t:text,isM:false,word:""}];
  for(const m of sorted){
    const next=[];
    for(const seg of segs){
      if(seg.isM){next.push(seg);continue;}
      const parts=seg.t.split(m.word);
      for(let i=0;i<parts.length;i++){
        if(parts[i]) next.push({t:parts[i],isM:false,word:""});
        if(i<parts.length-1) next.push({t:m.word,isM:true,word:m.word});
      }
    }
    segs=next;
  }
  return segs.map(seg=>{
    if(!seg.isM) return escH(seg.t);
    const k=mkey(pi,seg.word);
    const st=markerState[k];
    const rev=markerRevealed;
    let cls="word-span";
    if(st==="correct") cls+=" state-correct";
    else if(rev) cls+=" state-revealed";
    const m=markers.find(m=>m.word===seg.word);
    const badge=(st==="correct"||rev)
      ?`<span class="m-badge" style="background:${MB[m.method]};color:${MC[m.method]}">${m.method}</span>`:"";
    const clickable=!rev&&st!=="correct";
    return `<span class="${cls}"${clickable?` onclick="openPopup(${pi},'${escA(seg.word)}')"`:""} >${escH(seg.t)}</span>${badge}`;
  }).join("");
}

function renderQuiz(){
  document.getElementById("passage").innerHTML=
    ESSAYS[curE].paras.map((p,pi)=>`
      <div class="para-card">
        <div class="para-num">문단 ${pi+1}${p.markers.length?` — 표지어 ${p.markers.length}개`:""}</div>
        <div class="para-text">${tokenize(p.text,p.markers,pi)}</div>
      </div>`).join("");
}
function updateQuizScore(){
  const found=foundM(),total=totalM();
  document.getElementById("sc-found").textContent=found;
  document.getElementById("sc-total").textContent=total;
  const pct=total?Math.round(found/total*100):0;
  const msgs=["표지어를 클릭해 설명 방법을 맞혀 보세요!","잘 찾고 있어요!","절반 이상 찾았어요!","거의 다 왔어요!","모두 맞혔어요!"];
  document.getElementById("sc-msg").textContent=msgs[Math.min(Math.floor(pct/25),4)];
  const allOk=allCorrectM();
  document.getElementById("complete-banner").classList.toggle("show",allOk&&total>0);
  const btn=document.getElementById("reveal-btn");
  const icon=document.getElementById("reveal-icon");
  const label=document.getElementById("reveal-label");
  btn.classList.toggle("locked",!allOk);
  icon.className=allOk?"ti ti-eye":"ti ti-lock";
  label.textContent="정답 공개";
  if(allOk&&total>0) saveScore("step1",found,total);
}

function openPopup(pi,word){
  const k=mkey(pi,word);
  if(markerState[k]==="correct") return;
  const marker=ESSAYS[curE].paras[pi].markers.find(m=>m.word===word);
  if(!marker) return;
  activePopup={k,pi,word,method:marker.method};
  document.getElementById("pw-word").textContent=`"${word}"`;
  const fb=document.getElementById("pw-fb");
  fb.style.display="none"; fb.className="popup-fb";
  const wrong=METHODS.filter(m=>m!==marker.method).sort(()=>Math.random()-.5).slice(0,3);
  const choices=[marker.method,...wrong].sort(()=>Math.random()-.5);
  document.getElementById("pw-grid").innerHTML=choices.map(m=>`
    <button class="m-btn" onclick="chooseMethod('${m}')">
      <span class="mn"><span style="width:8px;height:8px;border-radius:50%;background:${MC[m]};display:inline-block;flex-shrink:0"></span>${m}</span>
      <span class="md">${METHOD_INFO[m].core}</span>
    </button>`).join("");
  document.getElementById("popup").style.display="flex";
}
function chooseMethod(chosen){
  if(!activePopup) return;
  const {k,method}=activePopup;
  const correct=chosen===method;
  document.querySelectorAll(".m-btn").forEach(btn=>{
    const nm=btn.querySelector(".mn");
    const label=nm?nm.textContent.trim():"";
    if(label===method) btn.classList.add("ok");
    if(label===chosen&&!correct) btn.classList.add("ng");
    btn.disabled=true;
  });
  const fb=document.getElementById("pw-fb");
  fb.style.display="block";
  if(correct){
    fb.className="popup-fb fb-ok"; fb.textContent="✓ 정답이에요!";
    markerState[k]="correct";
    setTimeout(()=>{closePopup();renderQuiz();updateQuizScore();},700);
  } else {
    fb.className="popup-fb fb-ng"; fb.textContent=`✗ 정답은 '${method}'예요.`;
  }
}
function onOverlayClick(e){if(e.target===document.getElementById("popup"))closePopup();}
function closePopup(){document.getElementById("popup").style.display="none";activePopup=null;}

function revealMarkers(){
  if(!allCorrectM()){
    const tip=document.getElementById("quiz-lock-tip");
    tip.classList.add("show"); setTimeout(()=>tip.classList.remove("show"),2200);
    return;
  }
  markerRevealed=true; renderQuiz();
  let rows="";
  ESSAYS[curE].paras.forEach((p,pi)=>{
    p.markers.forEach(m=>{
      rows+=`<div class="ans-row">
        <span class="ans-word">"${m.word}"</span>
        <span class="m-badge" style="background:${MB[m.method]};color:${MC[m.method]}">${m.method}</span>
        <span class="ans-check">✓</span>
      </div>`;
    });
  });
  document.getElementById("marker-result").innerHTML=`
    <div class="result-box" style="margin-top:1rem">
      <div class="result-head">표지어 전체 정답 목록</div>
      <div class="result-body"><div class="ans-list">${rows}</div></div>
    </div>`;
}
function resetMarkers(){
  ESSAYS[curE].paras.forEach((p,pi)=>p.markers.forEach(m=>delete markerState[mkey(pi,m.word)]));
  markerRevealed=false;
  document.getElementById("marker-result").innerHTML="";
  document.getElementById("complete-banner").classList.remove("show");
  document.getElementById("popup").style.display="none";
  activePopup=null;
  renderQuiz(); updateQuizScore();
}

// ════════════════════════════════════════
// 점수판
// ════════════════════════════════════════
function saveScore(step,correct,total){
  const team=document.getElementById("team-input").value.trim()||"모둠";
  let entry=scores.find(s=>s.team===team&&s.essay===ESSAYS[curE].title);
  if(!entry){entry={team,essay:ESSAYS[curE].title,step0:null,step1:null};scores.push(entry);}
  entry[step]={correct,total,pct:Math.round(correct/total*100)};
  renderScoreboard();
}
function renderScoreboard(){
  if(!scores.length){document.getElementById("scoreboard").style.display="none";return;}
  document.getElementById("scoreboard").style.display="block";
  document.getElementById("score-grid").innerHTML=scores.map(s=>`
    <div class="score-card">
      <div class="sc-team">${s.team} — ${s.essay}</div>
      ${s.step0?`<div style="font-size:12px;color:var(--green);margin-bottom:2px">문단 배치 ${s.step0.pct}점</div>`:""}
      ${s.step1?`<div style="font-size:12px;color:var(--blue)">표지어 퀴즈 ${s.step1.pct}점</div>`:""}
      <div class="sc-score">${calcTotal(s)}</div>
      <div class="sc-label">종합 점수</div>
    </div>`).join("");
}
function calcTotal(s){
  let sum=0,cnt=0;
  if(s.step0){sum+=s.step0.pct;cnt++;}
  if(s.step1){sum+=s.step1.pct;cnt++;}
  return cnt?Math.round(sum/cnt)+"점":"—";
}
function clearScores(){scores=[];document.getElementById("scoreboard").style.display="none";}

// ════════════════════════════════════════
// init
// ════════════════════════════════════════
renderEssayTabs();
ESSAYS[0].paras.forEach(p=>arrPlacement[p.id]="pool");
renderArrange();
updateArrScore();
renderStepTabs();
</script>
